# Field semantics: analysis/src/locus/analysis/model/cards.py.
conversation = "openai-compatible"
# The bundled mlx server reads `model`, `context_tokens`, and `base_url` at boot; an edit to them
# while a server is resident takes effect only at its next boot.
# A request filling this context (261,337 prompt tokens with 351 screenshots, then 807 generated)
# peaked at 39.9 GiB of live arrays on an M4 Pro Mac mini with 64 GB; the wired limit
# (iogpu.wired_limit_mb) has to allow that.
model = "mlx-community/Qwen3.6-35B-A3B-6bit"
base_url = "http://127.0.0.1:8847/v1"
family = "qwen3"
# Tokens per screenshot, by kind, at any viewport: each screenshot is drawn at the largest size
# whose cost fits its kind's value. Activity-screenshots are cheap on purpose: the model pulls any
# moment it needs to see in more detail at the pulled_screenshots value.
image_tokens = { activity_screenshots = 600, pulled_screenshots = 1200 }
thinking_budget = 16384
max_tokens = 24576
context_tokens = 262144
headroom = 0.8
# Qwen3.6 is trained to build on its reasoning from earlier turns, and its model card recommends
# keeping it for agent use: under preserve_thinking the template renders every assistant turn's
# reasoning, where by default it drops all of it before the latest user message.
chat_template_kwargs = { preserve_thinking = true }

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
presence_penalty = 1.5
