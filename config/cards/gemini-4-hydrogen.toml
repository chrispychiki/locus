# Field semantics: analysis/src/locus/analysis/model/cards.py.
conversation = "gemini"
model = "gemini-4-hydrogen"
default = true
# One window for input, thinking and output, per the model page:
# https://ai.google.dev/gemini-api/docs/models/gemini-4-hydrogen
context_tokens = 1048576
# Lower than the local cards': pulled screenshots ride the detail tier and the whole conversation
# re-bills every turn.
headroom = 0.5
thinking_levels = ["low", "medium", "high", "xhigh"]
thinking_level = "medium"
# activity_screenshots ride cheap by design: anything the pushed set can't show, the model re-buys
# at the pulled tier on exactly the moment it needs. Per-image cost is flat within a tier
# (280/560/1120/2240 for low/medium/high/ultra_high;
# https://ai.google.dev/gemini-api/docs/media-resolution).
media_resolution = { activity_screenshots = "medium", pulled_screenshots = "high" }
# Several times the largest reply seen, thinking included, and under the 65536 one request may
# output: a runaway thinking turn stops sooner and costs less, and every turn's room holds back only
# this much for the reply.
max_output_tokens = 32768

# From the pricing page (https://ai.google.dev/gemini-api/docs/pricing, read 2026-11-13): flat
# across the whole context window.
[pricing]
input_per_mtok = 1.5
cached_input_per_mtok = 0.075
output_per_mtok = 7.5
