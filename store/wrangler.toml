name = "locus-api"
main = "src/worker.js"
compatibility_date = "2026-06-01"

[assets]
directory = "./public"

[[r2_buckets]]
binding = "CHUNKS"
bucket_name = "locus-chunks"

[[analytics_engine_datasets]]
binding = "CAPTURE"
dataset = "locus_telemetry"

[version_metadata]
binding = "CF_VERSION_METADATA"
