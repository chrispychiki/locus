[project]
name = "locus-evidence"
version = "0.0.0"
description = "Locus evidence — the store's recorded rrweb into a queryable, replayable local db."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.26",
    "playwright>=1.64.1",
    "ua-parser>=1.0.2",
]

[project.scripts]
# Not a CLI verb: a credential helper whose key emission is called only by an
# ~/.aws profile's config line (and whose --write-profile is install.sh's).
# The module docstring carries the profile text.
locus-r2-credentials = "locus.evidence.credential_process:main"

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest==8.3.4",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# distill/ and vendor/ stay out of the wheel: distillation imports distill/'s npm packages, so
# locus-evidence runs from its clone, where assets.py finds both.
[tool.hatch.build.targets.wheel]
packages = ["src/locus"]
