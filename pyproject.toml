[tool.uv.workspace]
members = ["evidence", "analysis"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.uv]
package = false
# 48h supply-chain cooldown, for every resolution this workspace does.
exclude-newer = "48 hours"

# A bare `pytest` at the workspace root runs the packages' hermetic suites and nothing else —
# without this, rootdir discovery would also collect evidence/tests_live, which uploads to the
# real R2 bucket, and analysis/tests_model_server, which needs the running model server. Each
# runs only by explicit address: `uv run pytest tests_live` from evidence/, `uv run pytest
# tests_model_server` from analysis/.
[tool.pytest.ini_options]
# The workspace-root run's cache lands in the deployment's accreted data
# directory (a per-package run keeps its package-local cache: cache_dir is
# rootdir-relative, and each package is its own rootdir).
cache_dir = "data/cache/pytest"
testpaths = ["evidence/tests", "analysis/tests", "recorder/tests"]
addopts = ["-n", "auto", "--dist", "worksteal"]
