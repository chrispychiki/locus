[tool.uv.workspace]
members = ["evidence", "analysis"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.uv]
package = false
# 48h supply-chain cooldown, for every resolution this workspace does.
exclude-newer = "48 hours"

# The repo's only pytest config, so every run's rootdir is the repo root.
[tool.pytest.ini_options]
# The deployment's accreted data directory.
cache_dir = "data/cache/pytest"
testpaths = ["evidence/tests", "analysis/tests", "recorder/tests"]
# pytest's own defaults, plus the `*_tests` suites, which need a live service and run only when
# named: evidence/live_tests uploads to the real R2 bucket, analysis/model_server_tests needs the
# running model server. Their names must not begin with "test", because pytest loads the conftest
# of every test* subdirectory of the directory a run starts from.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "*_tests"]
# Tests are tmp_path-isolated (own dbs, ephemeral ports, per-home sockets), so they parallelize
# across all cores; worksteal keeps the browser-heavy long tail from serializing at the end.
addopts = ["-n", "auto", "--dist", "worksteal"]
filterwarnings = [
    "ignore:builtin type (Swig|swig).* has no __module__ attribute:DeprecationWarning",
]
